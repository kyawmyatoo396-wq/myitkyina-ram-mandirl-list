                        <button type="button" onclick="togglePassword('loginPassword', 'loginEye')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">

        let activeFormType = '';

        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const googleCompleteForm = document.getElementById('googleCompleteForm');
            const loginTabBtn = document.getElementById('loginTabBtn');
            const signupTabBtn = document.getElementById('signupTabBtn');
            const authTabs = document.getElementById('authTabs');
            const socialDivider = document.getElementById('socialDivider');
            const socialContainer = document.getElementById('socialContainer');

            googleCompleteForm.classList.add('hidden');
            authTabs.classList.remove('hidden');
            socialDivider.classList.remove('hidden');
            socialContainer.classList.remove('hidden');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                loginTabBtn.className = "flex-1 py-4 text-center font-semibold text-indigo-600 border-b-2 border-indigo-600 transition-colors duration-200";
                signupTabBtn.className = "flex-1 py-4 text-center font-semibold text-gray-400 hover:text-gray-600 border-b-2 border-transparent transition-colors duration-200";
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                signupTabBtn.className = "flex-1 py-4 text-center font-semibold text-indigo-600 border-b-2 border-indigo-600 transition-colors duration-200";
                loginTabBtn.className = "flex-1 py-4 text-center font-semibold text-gray-400 hover:text-gray-600 border-b-2 border-transparent transition-colors duration-200";
            }
            hideToast();
        }

        function togglePassword(fieldId, iconId) {
            const passwordField = document.getElementById(fieldId);
            const eyeIcon = document.getElementById(iconId);
            
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                eyeIcon.className = "fa-regular fa-eye-slash";
            } else {
                passwordField.type = 'password';
                eyeIcon.className = "fa-regular fa-eye";
            }
        }

        function checkQuarterSelection(formType) {
            activeFormType = formType;
            const selectElem = document.getElementById(formType + 'Quarter');
            
            if (selectElem.value) {
                selectElem.classList.remove('text-gray-500');
                selectElem.classList.add('text-gray-700');
            }

            if (selectElem.value === 'add_new') {
                document.getElementById('modalQuarterInput').value = '';
                document.getElementById('customQuarterModal').classList.remove('hidden');
                document.getElementById('modalQuarterInput').focus();
            }
        }

        function closeQuarterModal() {
            document.getElementById('customQuarterModal').classList.add('hidden');
            if (activeFormType) {
                document.getElementById(activeFormType + 'Quarter').value = "";
            }
        }

        function saveNewQuarter() {
            const inputVal = document.getElementById('modalQuarterInput').value.trim();
            if (!inputVal) {
                alert('ကျေးဇူးပြု၍ ရပ်ကွက်အမည် ထည့်ပါ။');
                return;
            }

            const selectElem = document.getElementById(activeFormType + 'Quarter');
            
            let exists = false;
            for (let i = 0; i < selectElem.options.length; i++) {
                if (selectElem.options[i].value === inputVal) {
                    exists = true;
                    break;
                }
            }

            if (!exists) {
                const opt = document.createElement('option');
                opt.value = inputVal;
                opt.textContent = inputVal;
                opt.className = "text-gray-700";
                
                const addNewOption = selectElem.querySelector('option[value="add_new"]');
                selectElem.insertBefore(opt, addNewOption);
            }

            selectElem.value = inputVal;
            selectElem.classList.remove('text-gray-500');
            selectElem.classList.add('text-gray-700');
            document.getElementById('customQuarterModal').classList.add('hidden');
        }

        function showToast(message, isSuccess = true) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `mb-4 p-3 rounded-lg text-sm text-center font-medium transition-all duration-300 ${isSuccess ? 'bg-green-100 text-green-700 border border-green-200' : 'bg-red-100 text-red-700 border border-red-200'}`;
            toast.classList.remove('hidden');
        }

        function hideToast() {
            document.getElementById('toast').classList.add('hidden');
        }

        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showToast('Please fill in all required fields.', false);
                return;
            }

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    showToast(`Success! Logged in as (${email}).`, true);
                })
                .catch((error) => {
                    showToast(error.message, false);
                });
        }

        function handleSignup(event) {
            event.preventDefault();
            const firstName = document.getElementById('signupFirstName').value.trim();
            const lastName = document.getElementById('signupLastName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const rePassword = document.getElementById('signupRePassword').value;
            const phone = document.getElementById('signupPhone').value.trim();
            
            const nationalityRadio = document.querySelector('input[name="signupNationality"]:checked');
            const nationality = nationalityRadio ? nationalityRadio.value : '';

            const isHeadRadio = document.querySelector('input[name="signupIsHead"]:checked');
            const isHead = isHeadRadio ? isHeadRadio.value : '';

            const address = document.getElementById('signupAddress').value.trim();
            const house = document.getElementById('signupHouse').value.trim();
            const quarter = document.getElementById('signupQuarter').value;

            if (!firstName || !lastName || !email || !password || !rePassword || !phone || !nationality || !isHead || !address || !house || !quarter) {
                showToast('Please fill in all required fields.', false);
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                showToast('Please enter a valid email address.', false);
                return;
            }

            if (password !== rePassword) {
                showToast('Passwords do not match. Please check again.', false);
                return;
            }

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;

                    return db.collection("users").doc(user.uid).set({
                        firstName: firstName,
                        lastName: lastName,
                        email: email,
                        phone: phone,
                        nationality: nationality,
                        isHeadOfHousehold: isHead,
                        address: address,
                        houseNumber: house,
                        quarter: quarter,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                })
                .then(() => {
                    showToast(`Welcome ${firstName}, your account has been created successfully.`, true);
                })
                .catch((error) => {
                    showToast(error.message, false);
                });
        }

        function handleGoogleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then((result) => {
                    document.getElementById('authTabs').classList.add('hidden');
                    document.getElementById('loginForm').classList.add('hidden');
                    document.getElementById('signupForm').classList.add('hidden');
                    document.getElementById('socialDivider').classList.add('hidden');
                    document.getElementById('socialContainer').classList.add('hidden');

                    document.getElementById('googleCompleteForm').classList.remove('hidden');
                    showToast('Google authentication successful! Please complete your profile.', true);
                })
                .catch((error) => {
                    showToast(error.message, false);
                });
        }

        function handleGoogleComplete(event) {
            event.preventDefault();
            const firstName = document.getElementById('googleFirstName').value.trim();
            const lastName = document.getElementById('googleLastName').value.trim();
            const phone = document.getElementById('googlePhone').value.trim();
            
            const nationalityRadio = document.querySelector('input[name="googleNationality"]:checked');
            const nationality = nationalityRadio ? nationalityRadio.value : '';

            const isHeadRadio = document.querySelector('input[name="googleIsHead"]:checked');
            const isHead = isHeadRadio ? isHeadRadio.value : '';

            const address = document.getElementById('googleAddress').value.trim();
            const house = document.getElementById('googleHouse').value.trim();
            const quarter = document.getElementById('googleQuarter').value;

            if (!firstName || !phone || !nationality || !isHead || !address || !house || !quarter) {
                showToast('Please fill in all required fields.', false);
                return;
            }

            const user = auth.currentUser;
            if (user) {
                db.collection("users").doc(user.uid).set({
                    firstName: firstName,
                    lastName: lastName,
                    email: user.email,
                    phone: phone,
                    nationality: nationality,
                    isHeadOfHousehold: isHead,
                    address: address,
                    houseNumber: house,
                    quarter: quarter,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                })
                .then(() => {
                    showToast(`Profile completed successfully! Welcome, ${firstName}.`, true);
                })
                .catch((error) => {
                    showToast(error.message, false);
                });
            } else {
                showToast('No authenticated user found. Please login again.', false);
            }
        }
    </script>
</body>
</html>
