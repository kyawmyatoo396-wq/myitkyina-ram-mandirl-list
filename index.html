    <!-- JavaScript Logic & Firebase Integration -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAxuC_IFz_Y4P6WjXc4JaYLW498EviUoxE",
            authDomain: "myitkyina-ram-mandirl-list.firebaseapp.com",
            projectId: "myitkyina-ram-mandirl-list",
            storageBucket: "myitkyina-ram-mandirl-list.firebasestorage.app",
            messagingSenderId: "901724346578",
            appId: "1:901724346578:web:ecc9c704ef24af6f33750b",
            measurementId: "G-6GRZ6Q1M7K"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let activeFormType = '';

        const defaultQuarters = ["MIN YAT", "MYOMA", "MYOTHIT", "YUZANA"];
        const defaultCities = ["MYITKYINA"];

        window.addEventListener('DOMContentLoaded', () => {
            loadDropdownData('Quarter');
            loadDropdownData('City');
        });

        // Helper function to calculate Age and validate DD-MM-YYYY format
        function parseDobAndCalculateAge(dobString) {
            const regex = /^(\d{2})-(\d{2})-(\d{4})$/;
            if (!regex.test(dobString)) return null;

            const parts = dobString.split('-');
            const day = parseInt(parts[0], 10);
            const month = parseInt(parts[1], 10);
            const year = parseInt(parts[2], 10);

            // Basic date validation
            if (month < 1 || month > 12 || day < 1 || day > 31 || year < 1900 || year > 2026) {
                return null;
            }

            const birthDate = new Date(year, month - 1, day);
            if (birthDate.getFullYear() !== year || birthDate.getMonth() !== month - 1 || birthDate.getDate() !== day) {
                return null; // Invalid calendar date (e.g. 31-02-2020)
            }

            const today = new Date();
            let age = today.getFullYear() - year;
            const m = today.getMonth() - (month - 1);
            if (m < 0 || (m === 0 && today.getDate() < day)) {
                age--;
            }

            return { age: age, date: birthDate };
        }

        async function loadDropdownData(type) {
            const collectionName = type === 'Quarter' ? 'quarters' : 'cities';
            const defaults = type === 'Quarter' ? defaultQuarters : defaultCities;
            
            try {
                const snapshot = await db.collection(collectionName).get();
                let items = [];
                
                if (snapshot.empty) {
                    for (let item of defaults) {
                        await db.collection(collectionName).doc(item).set({ name: item });
                        items.push(item);
                    }
                } else {
                    snapshot.forEach(doc => {
                        items.push(doc.id);
                    });

                    if (type === 'Quarter') {
                        items = items.map(item => item.replace(/(\s+QUARTER)$/i, '').trim());
                        items = items.filter(item => !item.match(/[\u1000-\u109F]/));
                        items = [...new Set(items)];
                        
                        items = items.filter(item => item !== "MIN YAT");
                        items.unshift("MIN YAT");

                    } else if (type === 'City') {
                        items = items.map(item => item.toUpperCase().trim());
                        items = [...new Set(items)];

                        items = items.filter(item => item !== "MYITKYINA");
                        items.unshift("MYITKYINA");

                        const myitkyinaCheck = await db.collection('cities').doc("MYITKYINA").get();
                        if (!myitkyinaCheck.exists) {
                            await db.collection('cities').doc("MYITKYINA").set({ name: "MYITKYINA" });
                        }
                    }
                }

                ['signup', 'google'].forEach(formType => {
                    const selectElem = document.getElementById(formType + type);
                    if (!selectElem) return;
                    
                    selectElem.innerHTML = '';
                    items.forEach(item => {
                        const opt = document.createElement('option');
                        opt.value = item;
                        opt.textContent = item;
                        opt.className = "text-gray-700";
                        selectElem.appendChild(opt);
                    });

                    const addOpt = document.createElement('option');
                    addOpt.value = "add_new";
                    addOpt.textContent = `+ Add ${type}`;
                    addOpt.className = "text-indigo-600 font-semibold";
                    selectElem.appendChild(addOpt);
                });

            } catch (error) {
                console.error(`Error loading ${type}:`, error);
            }
        }

        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const googleCompleteForm = document.getElementById('googleCompleteForm');
            const loginTabBtn = document.getElementById('loginTabBtn');
            const signupTabBtn = document.getElementById('signupTabBtn');
            const authTabs = document.getElementById('authTabs');
            const socialDivider = document.getElementById('socialDivider');
            const socialContainer = document.getElementById('socialContainer');

            googleCompleteForm.classList.add('hidden');
            authTabs.classList.remove('hidden');
            socialDivider.classList.remove('hidden');
            socialContainer.classList.remove('hidden');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                loginTabBtn.className = "flex-1 py-4 text-center font-semibold text-indigo-600 border-b-2 border-indigo-600 transition-colors duration-200";
                signupTabBtn.className = "flex-1 py-4 text-center font-semibold text-gray-400 hover:text-gray-600 border-b-2 border-transparent transition-colors duration-200";
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                signupTabBtn.className = "flex-1 py-4 text-center font-semibold text-indigo-600 border-b-2 border-indigo-600 transition-colors duration-200";
                loginTabBtn.className = "flex-1 py-4 text-center font-semibold text-gray-400 hover:text-gray-600 border-b-2 border-transparent transition-colors duration-200";
            }
            hideToast();
        }

        function togglePassword(fieldId, iconId) {
            const passwordField = document.getElementById(fieldId);
            const eyeIcon = document.getElementById(iconId);
            
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                eyeIcon.className = "fa-regular fa-eye-slash";
            } else {
                passwordField.type = 'password';
                eyeIcon.className = "fa-regular fa-eye";
            }
        }

        function checkQuarterSelection(formType) {
            activeFormType = formType;
            const selectElem = document.getElementById(formType + 'Quarter');

            if (selectElem.value === 'add_new') {
                document.getElementById('modalQuarterInput').value = '';
                document.getElementById('customQuarterModal').classList.remove('hidden');
                document.getElementById('modalQuarterInput').focus();
            }
        }

        function closeQuarterModal() {
            document.getElementById('customQuarterModal').classList.add('hidden');
            if (activeFormType) {
                document.getElementById(activeFormType + 'Quarter').value = "MIN YAT";
            }
        }

        async function saveNewQuarter() {
            let inputVal = document.getElementById('modalQuarterInput').value.trim().toUpperCase();
            if (!inputVal) {
                alert('Please enter a quarter name.');
                return;
            }

            inputVal = inputVal.replace(/(\s+QUARTER)$/i, '').trim();

            try {
                await db.collection('quarters').doc(inputVal).set({ name: inputVal });
                await loadDropdownData('Quarter');

                ['signup', 'google'].forEach(fType => {
                    const elem = document.getElementById(fType + 'Quarter');
                    if (elem) elem.value = inputVal;
                });

                document.getElementById('customQuarterModal').classList.add('hidden');
                showToast('New quarter saved successfully.', true);
            } catch (error) {
                showToast(error.message, false);
            }
        }

        function checkCitySelection(formType) {
            activeFormType = formType;
            const selectElem = document.getElementById(formType + 'City');
            
            if (selectElem.value === 'add_new') {
                document.getElementById('modalCityInput').value = '';
                document.getElementById('customCityModal').classList.remove('hidden');
                document.getElementById('modalCityInput').focus();
            }
        }

        function closeCityModal() {
            document.getElementById('customCityModal').classList.add('hidden');
            if (activeFormType) {
                document.getElementById(activeFormType + 'City').value = "MYITKYINA";
            }
        }

        async function saveNewCity() {
            const inputVal = document.getElementById('modalCityInput').value.trim().toUpperCase();
            if (!inputVal) {
                alert('Please enter a city name.');
                return;
            }

            try {
                await db.collection('cities').doc(inputVal).set({ name: inputVal });
                await loadDropdownData('City');

                ['signup', 'google'].forEach(fType => {
                    const elem = document.getElementById(fType + 'City');
                    if (elem) elem.value = inputVal;
                });

                document.getElementById('customCityModal').classList.add('hidden');
                showToast('New city saved successfully.', true);
            } catch (error) {
                showToast(error.message, false);
            }
        }

        function showToast(message, isSuccess = true) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `mb-4 p-3 rounded-lg text-sm text-center font-medium transition-all duration-300 ${isSuccess ? 'bg-green-100 text-green-700 border border-green-200' : 'bg-red-100 text-red-700 border border-red-200'}`;
            toast.classList.remove('hidden');

            const scrollContainer = document.getElementById('scrollContainer');
            if (scrollContainer) {
                scrollContainer.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function hideToast() {
            document.getElementById('toast').classList.add('hidden');
        }

        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showToast('Please fill in all required fields.', false);
                return;
            }

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    showToast(`Success! Logged in as (${email}). Redirecting...`, true);
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                })
                .catch((error) => {
                    showToast(error.message, false);
                });
        }

        function handleSignup(event) {
            event.preventDefault();
            const firstName = document.getElementById('signupFirstName').value.trim();
            const lastName = document.getElementById('signupLastName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const rePassword = document.getElementById('signupRePassword').value;
            
            const genderRadio = document.querySelector('input[name="signupGender"]:checked');
            const gender = genderRadio ? genderRadio.value : '';
            const dobStr = document.getElementById('signupDob').value.trim();

            const phone = document.getElementById('signupPhone').value.trim();
            
            const nationalityRadio = document.querySelector('input[name="signupNationality"]:checked');
            const nationality = nationalityRadio ? nationalityRadio.value : '';

            const isHeadRadio = document.querySelector('input[name="signupIsHead"]:checked');
            const isHead = isHeadRadio ? isHeadRadio.value : '';

            const house = document.getElementById('signupHouse').value.trim().toUpperCase();
            const quarter = document.getElementById('signupQuarter').value;
            const city = document.getElementById('signupCity').value;

            if (!firstName || !lastName || !email || !password || !rePassword || !gender || !dobStr || !phone || !nationality || !isHead || !house || !quarter || !city) {
                showToast('Please fill in all required fields.', false);
                return;
            }

            const dobResult = parseDobAndCalculateAge(dobStr);
            if (!dobResult) {
                showToast('Invalid Date of Birth format. Please use DD-MM-YYYY (e.g., 15-08-1995).', false);
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                showToast('Please enter a valid email address.', false);
                return;
            }

            if (password !== rePassword) {
                showToast('Passwords do not match. Please check again.', false);
                return;
            }

            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;

                    return db.collection("users").doc(user.uid).set({
                        firstName: firstName,
                        lastName: lastName,
                        email: email,
                        gender: gender,
                        dateOfBirth: dobStr,
                        age: dobResult.age,
                        phone: phone,
                        nationality: nationality,
                        isHeadOfHousehold: isHead,
                        houseNumber: house,
                        quarter: quarter,
                        city: city,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                })
                .then(() => {
                    showToast(`Welcome ${firstName}, account created! Redirecting...`, true);
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                })
                .catch((error) => {
                    showToast(error.message, false);
                });
        }

        function handleGoogleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider)
                .then(async (result) => {
                    const user = result.user;
                    
                    const userDoc = await db.collection("users").doc(user.uid).get();
                    if (userDoc.exists) {
                        showToast('Google Sign-In successful! Redirecting...', true);
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1000);
                    } else {
                        document.getElementById('authTabs').classList.add('hidden');
                        document.getElementById('loginForm').classList.add('hidden');
                        document.getElementById('signupForm').classList.add('hidden');
                        document.getElementById('socialDivider').classList.add('hidden');
                        document.getElementById('socialContainer').classList.add('hidden');

                        document.getElementById('googleCompleteForm').classList.remove('hidden');
                        showToast('Google authentication successful! Please complete your profile.', true);
                    }
                })
                .catch((error) => {
                    showToast(error.message, false);
                });
        }

        function handleGoogleComplete(event) {
            event.preventDefault();
            const firstName = document.getElementById('googleFirstName').value.trim();
            const lastName = document.getElementById('googleLastName').value.trim();
            
            const genderRadio = document.querySelector('input[name="googleGender"]:checked');
            const gender = genderRadio ? genderRadio.value : '';
            const dobStr = document.getElementById('googleDob').value.trim();

            const phone = document.getElementById('googlePhone').value.trim();
            
            const nationalityRadio = document.querySelector('input[name="googleNationality"]:checked');
            const nationality = nationalityRadio ? nationalityRadio.value : '';

            const isHeadRadio = document.querySelector('input[name="googleIsHead"]:checked');
            const isHead = isHeadRadio ? isHeadRadio.value : '';

            const house = document.getElementById('googleHouse').value.trim().toUpperCase();
            const quarter = document.getElementById('googleQuarter').value;
            const city = document.getElementById('googleCity').value;

            if (!firstName || !gender || !dobStr || !phone || !nationality || !isHead || !house || !quarter || !city) {
                showToast('Please fill in all required fields.', false);
                return;
            }

            const dobResult = parseDobAndCalculateAge(dobStr);
            if (!dobResult) {
                showToast('Invalid Date of Birth format. Please use DD-MM-YYYY (e.g., 15-08-1995).', false);
                return;
            }

            const user = auth.currentUser;
            if (user) {
                db.collection("users").doc(user.uid).set({
                    firstName: firstName,
                    lastName: lastName,
                    email: user.email,
                    gender: gender,
                    dateOfBirth: dobStr,
                    age: dobResult.age,
                    phone: phone,
                    nationality: nationality,
                    isHeadOfHousehold: isHead,
                    houseNumber: house,
                    quarter: quarter,
                    city: city,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                })
                .then(() => {
                    showToast(`Profile completed successfully! Redirecting...`, true);
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                })
                .catch((error) => {
                    showToast(error.message, false);
                });
            } else {
                showToast('No authenticated user found. Please login again.', false);
            }
        }
    </script>
